name: Diagnose private contributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check authentication and contribution data
        env:
          PROFILE_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        shell: python
        run: |
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          rows = []
          notes = []
          token = os.environ.get('PROFILE_TOKEN', '').strip()
          expected = os.environ['EXPECTED_OWNER']

          class DiagnosticError(Exception):
              pass

          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request('https://api.github.com' + path, data=body, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'private-contribution-diagnostic',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return json.load(response), response.headers
              except urllib.error.HTTPError as error:
                  # Do not print URLs, API response bodies, or request headers.
                  raise DiagnosticError('GitHub returned HTTP ' + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise DiagnosticError('GitHub request failed or timed out') from None

          def add(label, value):
              rows.append((label, str(value)))

          def main():
              if not token:
                  raise DiagnosticError('SUMMARY_GITHUB_TOKEN is missing or empty')
              kind = 'Fine-grained' if token.startswith('github_pat_') else 'Classic PAT' if token.startswith('ghp_') else 'Other token type'
              add('Stored token type', kind)
              identity, headers = request('/user')
              matches = identity.get('login', '').casefold() == expected.casefold()
              add('Token belongs to profile owner', 'Yes' if matches else 'No')
              scopes = {s.strip() for s in headers.get('X-OAuth-Scopes', '').split(',') if s.strip()}
              if kind == 'Classic PAT':
                  add('read:user or user scope', 'Yes' if scopes.intersection({'read:user', 'user'}) else 'No')
                  add('repo scope', 'Yes' if 'repo' in scopes else 'No')
              if not matches:
                  notes.append('The stored secret authenticates a different account. Update SUMMARY_GITHUB_TOKEN with a token from the profile owner.')
                  return

              query = '''query($login: String!) {
                viewer {
                  contributionsCollection {
                    totalCommitContributions
                    restrictedContributionsCount
                    contributionCalendar { totalContributions }
                  }
                }
                user(login: $login) {
                  isViewer
                  contributionsCollection {
                    startedAt
                    endedAt
                    totalCommitContributions
                    restrictedContributionsCount
                    contributionCalendar { totalContributions }
                  }
                }
              }'''
              result, _ = request('/graphql', {'query': query, 'variables': {'login': expected}})
              if result.get('errors'):
                  add('Contribution query', 'GraphQL rejected the query')
                  notes.append('Repository access and contribution-query access are separate. The API rejected the contribution query; no error payload or private data was printed.')
              else:
                  data = result['data']
                  user = data['user']['contributionsCollection']
                  viewer = data['viewer']['contributionsCollection']
                  add('User query recognizes token owner', data['user']['isViewer'])
                  add('User query: commits in past year', user['totalCommitContributions'])
                  add('User query: all contributions in past year', user['contributionCalendar']['totalContributions'])
                  add('User query: restricted contributions', user['restrictedContributionsCount'])
                  add('Viewer query: commits in past year', viewer['totalCommitContributions'])
                  add('Viewer query: all contributions in past year', viewer['contributionCalendar']['totalContributions'])
                  add('Window start (UTC)', user['startedAt'])
                  add('Window end (UTC)', user['endedAt'])
                  if user['totalCommitContributions'] > 0:
                      notes.append('GitHub returns nonzero commit data directly. Investigate the chart generator or the freshness of its output.')
                  elif viewer['totalCommitContributions'] > 0:
                      notes.append('The viewer query has commits while the user query does not. The generator should use the authenticated viewer query.')
                  else:
                      notes.append('Both direct contribution queries returned zero commits. A successful chart-generation job does not establish that GitHub returned the expected data.')

              # Only inspect a small private-repository sample. No names or commit details are logged.
              repos = []
              for page in range(1, 11):
                  batch, _ = request('/user/repos?' + urllib.parse.urlencode({
                      'affiliation': 'owner', 'visibility': 'all', 'per_page': 100, 'page': page,
                  }))
                  if not isinstance(batch, list):
                      raise DiagnosticError('Unexpected repository-list response')
                  repos.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise DiagnosticError('Repository listing exceeded the diagnostic limit')
              private = [r for r in repos if r.get('private') and r.get('owner', {}).get('login', '').casefold() == expected.casefold()]
              add('Owned private repositories visible to token', len(private))
              sample = [r for r in private if not r.get('fork')][:3]
              tested = matched = failed = 0
              since = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=365)).isoformat()
              for repo in sample:
                  tested += 1
                  endpoint = '/repos/' + urllib.parse.quote(repo['full_name'], safe='/') + '/commits?'
                  endpoint += urllib.parse.urlencode({'author': expected, 'since': since, 'per_page': 1})
                  try:
                      commits, _ = request(endpoint)
                      if isinstance(commits, list) and commits:
                          matched += 1
                  except DiagnosticError:
                      failed += 1
              add('Private repositories sampled for authored commits', tested)
              add('Sampled repositories with your commits in past year', matched)
              add('Sample requests that failed', failed)
              if matched:
                  notes.append('Your token can read authored commits directly from private repositories. These can support a direct-repository chart if the contribution API continues returning zero.')
              if kind == 'Classic PAT' and not scopes.intersection({'read:user', 'user'}):
                  notes.append('The secret currently used by this run lacks the documented read:user scope.')

          failed = False
          try:
              main()
          except DiagnosticError as error:
              add('Diagnostic error', str(error))
              failed = True
          except Exception:
              add('Diagnostic error', 'Unexpected response format; no private response data was printed')
              failed = True
          summary = '## Private contribution diagnostic\n\n| Check | Result |\n|---|---|\n'
          summary += ''.join('| ' + key + ' | ' + value.replace('|', '/') + ' |\n' for key, value in rows)
          summary += '\n' + '\n\n'.join(notes) + '\n'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write(summary)
          print(summary)
          if failed:
              raise SystemExit(1)
